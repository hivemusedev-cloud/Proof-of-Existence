[package]
name = "poe-mobile"
version = "0.1.0"
edition = "2021"
description = "PoE mobile shell core: the device-identity surface a phone app needs (ML-DSA device key, machine id, signing), exposed to Kotlin and Swift through UniFFI (BUILD_FLOW Step 7)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
poe-crypto = { path = "../poe-crypto" }
poe-identity = { path = "../poe-identity" }
poe-wallet = { path = "../poe-wallet" }
poe-finality = { path = "../poe-finality" }
poe-store = { path = "../poe-store" }
poe-kernel = { path = "../poe-kernel" }
rand = "0.8"

[dev-dependencies]
poe-dag = { path = "../poe-dag" }
